<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" font-family="'Courier New', Consolas, monospace">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f1e"/>
      <stop offset="100%" stop-color="#050812"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#001829"/>
      <stop offset="100%" stop-color="#000814"/>
    </linearGradient>
    <linearGradient id="photoOverlay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#001829" stop-opacity="0.75"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="strongGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="cyanTint">
      <feColorMatrix type="matrix" values="
        0.2 0.2 0.2 0 0
        0.3 0.5 0.5 0 0.1
        0.4 0.6 0.9 0 0.2
        0   0   0   1 0"/>
    </filter>
    <pattern id="scanlines" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="transparent"/>
      <rect y="2" width="4" height="2" fill="#000" opacity="0.2"/>
    </pattern>
    <clipPath id="screenClip">
      <rect x="70" y="100" width="470" height="550" rx="6"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1200" height="720" fill="url(#bgGrad)"/>

  <!-- Window chrome / title bar -->
  <rect x="40" y="40" width="1120" height="640" rx="10" fill="#0d1526" stroke="#1a2440" stroke-width="1"/>
  <rect x="40" y="40" width="1120" height="36" rx="10" fill="#111a2e"/>
  <rect x="40" y="66" width="1120" height="10" fill="#111a2e"/>

  <!-- Traffic lights -->
  <circle cx="64" cy="58" r="7" fill="#ff5f57"/>
  <circle cx="86" cy="58" r="7" fill="#febc2e"/>
  <circle cx="108" cy="58" r="7" fill="#28c840"/>

  <!-- Title bar text -->
  <text x="600" y="63" fill="#5a6a85" font-size="13" text-anchor="middle">immanueltampubolon594 / README.md</text>
  <text x="1130" y="63" fill="#5a6a85" font-size="13" text-anchor="end">immanuel@ai:~ $ ./profile --live</text>

  <!-- Inner terminal screen (left - portrait area) -->
  <rect x="70" y="100" width="470" height="550" rx="6" fill="url(#screenGrad)" stroke="#0a3a5a" stroke-width="1"/>

  <!-- Screen label -->
  <text x="90" y="128" fill="#00d4ff" font-size="12" letter-spacing="2">_VISUAL.MAP / PORTRAIT.SIGNAL</text>
  <line x1="90" y1="138" x2="520" y2="138" stroke="#00d4ff" opacity="0.3" stroke-width="1"/>

  <!-- Photo with cyan tint -->
  <g clip-path="url(#screenClip)">
    <image href="Immanuel.jpeg" x="130" y="155" width="350" height="470" preserveAspectRatio="xMidYMid slice" filter="url(#cyanTint)" opacity="0.85"/>

    <!-- Cyan overlay gradient on photo -->
    <rect x="130" y="155" width="350" height="470" fill="url(#photoOverlay)" opacity="0.5"/>

    <!-- Scanline overlay on photo area -->
    <rect x="70" y="100" width="470" height="550" fill="url(#scanlines)" opacity="0.7"/>
  </g>

  <!-- Frame border glow around photo -->
  <rect x="130" y="155" width="350" height="470" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.4"/>

  <!-- Corner brackets on photo frame -->
  <g stroke="#00d4ff" stroke-width="2" fill="none" filter="url(#glow)">
    <!-- Top-left -->
    <path d="M 125 170 L 125 150 L 145 150"/>
    <!-- Top-right -->
    <path d="M 465 150 L 485 150 L 485 170"/>
    <!-- Bottom-left -->
    <path d="M 125 610 L 125 630 L 145 630"/>
    <!-- Bottom-right -->
    <path d="M 465 630 L 485 630 L 485 610"/>
  </g>

  <!-- Right side - Terminal info panel -->
  <g font-size="14" fill="#7dd3fc">
    <!-- Prompt header -->
    <text x="570" y="128" fill="#00d4ff" filter="url(#glow)" font-size="15">immanuel@agentlab:~ $</text>
    <text x="810" y="128" fill="#8b9cb8" font-size="13">session.active</text>

    <!-- SYSTEM.INFO -->
    <text x="570" y="165" fill="#00d4ff" filter="url(#glow)" font-size="13" letter-spacing="2">SYSTEM.INFO / PROFILE.LOADED</text>
    <line x1="570" y1="172" x2="1140" y2="172" stroke="#00d4ff" opacity="0.3"/>

    <text x="570" y="195" fill="#6a9cc4">Subject</text>
    <text x="700" y="195" fill="#00d4ff" filter="url(#glow)">:  Immanuel Tampubolon</text>

    <text x="570" y="215" fill="#6a9cc4">Role</text>
    <text x="700" y="215" fill="#00d4ff" filter="url(#glow)">:  AI Engineer</text>

    <text x="570" y="235" fill="#6a9cc4">Affiliation</text>
    <text x="700" y="235" fill="#00d4ff" filter="url(#glow)">:  Institut Teknologi Del</text>

    <text x="570" y="255" fill="#6a9cc4">Base</text>
    <text x="700" y="255" fill="#00d4ff" filter="url(#glow)">:  North Sumatra, Indonesia</text>

    <text x="570" y="275" fill="#6a9cc4">Status</text>
    <text x="700" y="275" fill="#4ade80" filter="url(#strongGlow)">:  Building / Shipping / Open-to-Work</text>

    <!-- RESEARCH.MODE -->
    <text x="570" y="310" fill="#00d4ff" filter="url(#glow)" font-size="13" letter-spacing="2">RESEARCH.MODE</text>
    <line x1="570" y1="317" x2="1140" y2="317" stroke="#00d4ff" opacity="0.3"/>

    <text x="570" y="340" fill="#6a9cc4">Primary</text>
    <text x="700" y="340" fill="#00d4ff" filter="url(#glow)">:  Applied AI Engineering</text>

    <text x="570" y="360" fill="#6a9cc4">Direction</text>
    <text x="700" y="360" fill="#00d4ff" filter="url(#glow)">:  Production-grade ML systems</text>

    <text x="570" y="380" fill="#6a9cc4">Themes</text>
    <text x="700" y="380" fill="#00d4ff" filter="url(#glow)">:  Computer Vision · RAG · Agents</text>

    <!-- BUILD.LOG -->
    <text x="570" y="415" fill="#00d4ff" filter="url(#glow)" font-size="13" letter-spacing="2">BUILD.LOG</text>
    <line x1="570" y1="422" x2="1140" y2="422" stroke="#00d4ff" opacity="0.3"/>

    <text x="570" y="445" fill="#6a9cc4">OmniPresence</text>
    <text x="710" y="445" fill="#00d4ff" filter="url(#glow)">:  Desk-occupancy analytics (YOLOv8)</text>

    <text x="570" y="465" fill="#6a9cc4">CyberGuard</text>
    <text x="710" y="465" fill="#00d4ff" filter="url(#glow)">:  RAG cybersecurity assistant</text>

    <text x="570" y="485" fill="#6a9cc4">Sentinel</text>
    <text x="710" y="485" fill="#00d4ff" filter="url(#glow)">:  Autonomous AI coding agent</text>

    <text x="570" y="505" fill="#6a9cc4">DevPulse</text>
    <text x="710" y="505" fill="#00d4ff" filter="url(#glow)">:  AI code reviewer for GitHub PRs</text>

    <text x="570" y="525" fill="#6a9cc4">VoiceGuard</text>
    <text x="710" y="525" fill="#00d4ff" filter="url(#glow)">:  AI voice detection (AASIST)</text>

    <!-- GRID.LINKS -->
    <text x="570" y="560" fill="#00d4ff" filter="url(#glow)" font-size="13" letter-spacing="2">GRID.LINKS</text>
    <line x1="570" y1="567" x2="1140" y2="567" stroke="#00d4ff" opacity="0.3"/>

    <text x="570" y="590" fill="#6a9cc4">Github</text>
    <text x="700" y="590" fill="#00d4ff" filter="url(#glow)">:  @immanueltampubolon594</text>

    <text x="570" y="610" fill="#6a9cc4">Portfolio</text>
    <text x="700" y="610" fill="#00d4ff" filter="url(#glow)">:  portfolio-gamma-blush-68.vercel.app</text>

    <!-- Footer signal -->
    <text x="570" y="650" fill="#4ade80" filter="url(#strongGlow)" font-size="13">@signal.locked &gt; AI / VISION / AGENTS</text>
  </g>

  <!-- Blinking cursor effect (static) -->
  <rect x="945" y="640" width="10" height="14" fill="#4ade80" opacity="0.8"/>

  <!-- Overall scanline overlay (subtle) -->
  <rect width="1200" height="720" fill="url(#scanlines)" opacity="0.08"/>
</svg>

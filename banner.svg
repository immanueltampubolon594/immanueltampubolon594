<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 820" font-family="'Courier New', Consolas, monospace">
  <style>
    /* Default (light mode) colors */
    .bg-start { stop-color: #f6f8fa; }
    .bg-end { stop-color: #e8edf2; }
    .window-fill { fill: #ffffff; }
    .window-stroke { stroke: #d0d7de; }
    .titlebar-fill { fill: #f0f3f6; }
    .title-text { fill: #656d76; }
    .primary { fill: #0969da; }
    .label { fill: #656d76; }
    .accent { fill: #1a7f37; }
    .divider { stroke: #0969da; opacity: 0.4; }
    .scanline-fill { fill: #000; opacity: 0.04; }
    .section-weight { font-weight: bold; }

    /* Dark mode overrides */
    @media (prefers-color-scheme: dark) {
      .bg-start { stop-color: #0a0f1e; }
      .bg-end { stop-color: #050812; }
      .window-fill { fill: #0d1526; }
      .window-stroke { stroke: #1a2440; }
      .titlebar-fill { fill: #111a2e; }
      .title-text { fill: #5a6a85; }
      .primary { fill: #00d4ff; }
      .label { fill: #6a9cc4; }
      .accent { fill: #4ade80; }
      .divider { stroke: #00d4ff; opacity: 0.3; }
      .scanline-fill { fill: #000; opacity: 0.15; }
      .section-weight { font-weight: normal; }
    }
  </style>

  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" class="bg-start"/>
      <stop offset="100%" class="bg-end"/>
    </linearGradient>
    <pattern id="scanlines" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="transparent"/>
      <rect y="2" width="4" height="2" class="scanline-fill"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="820" fill="url(#bgGrad)"/>

  <!-- Window chrome / title bar -->
  <rect x="20" y="20" width="760" height="780" rx="10" class="window-fill" stroke-width="1" style="stroke: currentColor;"/>
  <rect x="20" y="20" width="760" height="780" rx="10" fill="none" class="window-stroke" stroke-width="1"/>
  <rect x="20" y="20" width="760" height="36" rx="10" class="titlebar-fill"/>
  <rect x="20" y="46" width="760" height="10" class="titlebar-fill"/>

  <!-- Traffic lights -->
  <circle cx="44" cy="38" r="7" fill="#ff5f57"/>
  <circle cx="66" cy="38" r="7" fill="#febc2e"/>
  <circle cx="88" cy="38" r="7" fill="#28c840"/>

  <!-- Title bar text -->
  <text x="400" y="43" class="title-text" font-size="13" text-anchor="middle">immanueltampubolon594 / README.md</text>
  <text x="750" y="43" class="title-text" font-size="12" text-anchor="end">immanuel@ai:~ $ ./profile --live</text>

  <!-- Info panel -->
  <g font-size="15">
    <text x="50" y="100" class="primary section-weight" font-size="16">immanuel@agentlab:~ $</text>
    <text x="340" y="100" class="label" font-size="13">session.active</text>

    <!-- SYSTEM.INFO -->
    <text x="50" y="145" class="primary section-weight" font-size="14" letter-spacing="2">SYSTEM.INFO / PROFILE.LOADED</text>
    <line x1="50" y1="152" x2="750" y2="152" class="divider"/>

    <text x="50" y="180" class="label">Subject</text>
    <text x="220" y="180" class="primary">:  Immanuel Tampubolon</text>

    <text x="50" y="203" class="label">Role</text>
    <text x="220" y="203" class="primary">:  AI Engineer</text>

    <text x="50" y="226" class="label">Affiliation</text>
    <text x="220" y="226" class="primary">:  Institut Teknologi Del</text>

    <text x="50" y="249" class="label">Base</text>
    <text x="220" y="249" class="primary">:  North Sumatra, Indonesia</text>

    <text x="50" y="272" class="label">Status</text>
    <text x="220" y="272" class="accent section-weight">:  Building / Shipping / Open-to-Work</text>

    <!-- RESEARCH.MODE -->
    <text x="50" y="315" class="primary section-weight" font-size="14" letter-spacing="2">RESEARCH.MODE</text>
    <line x1="50" y1="322" x2="750" y2="322" class="divider"/>

    <text x="50" y="350" class="label">Primary</text>
    <text x="220" y="350" class="primary">:  Applied AI Engineering</text>

    <text x="50" y="373" class="label">Direction</text>
    <text x="220" y="373" class="primary">:  Production-grade ML systems</text>

    <text x="50" y="396" class="label">Themes</text>
    <text x="220" y="396" class="primary">:  Computer Vision · RAG · Agents</text>

    <!-- BUILD.LOG -->
    <text x="50" y="440" class="primary section-weight" font-size="14" letter-spacing="2">BUILD.LOG</text>
    <line x1="50" y1="447" x2="750" y2="447" class="divider"/>

    <text x="50" y="475" class="label">OmniPresence</text>
    <text x="230" y="475" class="primary">:  Desk-occupancy analytics (YOLOv8)</text>

    <text x="50" y="498" class="label">CyberGuard</text>
    <text x="230" y="498" class="primary">:  RAG cybersecurity assistant</text>

    <text x="50" y="521" class="label">Sentinel</text>
    <text x="230" y="521" class="primary">:  Autonomous AI coding agent</text>

    <text x="50" y="544" class="label">DevPulse</text>
    <text x="230" y="544" class="primary">:  AI code reviewer for GitHub PRs</text>

    <text x="50" y="567" class="label">VoiceGuard</text>
    <text x="230" y="567" class="primary">:  AI voice detection (AASIST)</text>

    <!-- STACK -->
    <text x="50" y="610" class="primary section-weight" font-size="14" letter-spacing="2">STACK</text>
    <line x1="50" y1="617" x2="750" y2="617" class="divider"/>

    <text x="50" y="645" class="label">ML / AI</text>
    <text x="220" y="645" class="primary">:  PyTorch · YOLOv8 · LangChain · Cohere</text>

    <text x="50" y="668" class="label">Backend</text>
    <text x="220" y="668" class="primary">:  FastAPI · Laravel · Go · Node.js</text>

    <text x="50" y="691" class="label">Frontend</text>
    <text x="220" y="691" class="primary">:  Next.js · React · TypeScript · Tailwind</text>

    <text x="50" y="714" class="label">Infra</text>
    <text x="220" y="714" class="primary">:  Docker · Nginx</text>

    <!-- GRID.LINKS -->
    <text x="50" y="757" class="primary section-weight" font-size="14" letter-spacing="2">GRID.LINKS</text>
    <line x1="50" y1="764" x2="750" y2="764" class="divider"/>

    <!-- Footer signal -->
    <text x="50" y="788" class="accent section-weight" font-size="14">@signal.locked &gt; AI / VISION / AGENTS</text>
  </g>

  <!-- Blinking cursor -->
  <rect x="500" y="778" width="11" height="15" class="accent" opacity="0.9"/>

  <!-- Scanline overlay -->
  <rect width="800" height="820" fill="url(#scanlines)"/>
</svg>
